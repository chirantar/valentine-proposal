<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <meta name="description" content="A special question for a special person. Will you be my Valentine?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card" id="mainCard">
            <h1 class="question">Tanuj, will you be my best brother? 👊</h1>
            <div class="gif-container">
                <img src="https://media.tenor.com/IsUSw05kZnUAAAAC/panda-waving.gif" alt="Cute panda waving"
                    class="intro-gif">
            </div>
            <div class="button-group">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
        </div>

        <div id="successContainer" class="hidden">
            <h1 class="success-message">Yay!! Best Bros Forever! 👊😎</h1>
            <div class="gif-container-success">
                <img src="https://media.tenor.com/J33K29mF8vsAAAAC/panda-dance.gif" alt="Panda dancing animation"
                    class="success-gif">
            </div>
            <p class="sub-message">I knew you'd say yes, Bro!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
