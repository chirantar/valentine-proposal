<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <meta name="description" content="A special question for a special person. Will you be my Valentine?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card" id="mainCard">
            <h1 class="question">Will you be my Valentine? 💖</h1>
            <div class="gif-container">
                <img src="https://gifdb.com/images/high/cute-love-bear-roses-ou7zho5oosxnpo6k.gif"
                    alt="Cute bear with roses" class="intro-gif">
            </div>
            <div class="button-group">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
        </div>

        <div id="successContainer" class="hidden">
            <h1 class="success-message">Yay!! 💕🥰</h1>
            <div class="gif-container-success">
                <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif"
                    alt="Bear kissing animation" class="success-gif">
            </div>
            <p class="sub-message">I knew you'd say yes!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
